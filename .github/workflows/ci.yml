name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject private data, business residue, host paths, and key material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          from scripts.repository_boundary import semantic_text

          tracked = [
              item
              for item in subprocess.check_output(["git", "ls-files", "-z"])
              .decode("utf-8")
              .split("\0")
              if item
          ]
          forbidden_roots = {
              "vault", ".state", ".data", "source-archive", "receipts", "checkpoints",
              "runtime-data", "release", ".venv", "venv", "build", "dist",
              "worktrees", "prompts", "raw-logs", "sessions", "output"
          }
          forbidden_suffixes = {
              ".db", ".sqlite", ".sqlite3", ".key", ".pem", ".p12", ".pfx"
          }
          path_violations = []
          for raw in tracked:
              path = PurePosixPath(raw)
              name = path.name
              if (
                  (path.parts and path.parts[0] in forbidden_roots)
                  or raw == "config/sources.json"
                  or raw == ".qingtian-knowledge-root"
                  or name == ".env"
                  or (name.startswith(".env.") and name != ".env.example")
                  or name.endswith(".local.json")
                  or name.endswith(".pid") or ".pid." in name
                  or name in {"instance.lock", "server.log"}
                  or re.search(r"\.(?:db|sqlite|sqlite3)-(?:wal|shm|journal)$", name, re.I)
                  or ".data" in path.parts
                  or path.suffix.lower() in forbidden_suffixes
                  or "__pycache__" in path.parts
                  or name.endswith((".pyc", ".pyo"))
                  or (path.suffix.lower() in {".mp4", ".webm", ".mov", ".mkv", ".pptx"}
                      and raw != "docs/assets/showcase/qingtian-showcase-short.mp4")
                  or Path(raw).is_symlink()
              ):
                  path_violations.append(raw)

          business_terms = [
              "xing" + "huo",
              "星" + "火",
              "peer" + "soft",
              "cat2" + "bug",
              "ns" + "fw",
              "r" + "18",
              "ai-partner" + "-lab/xing" + "huo",
          ]
          developer_paths = [
              "/" + "Users" + "/" + "tab" + "/",
              "/" + "home" + "/" + "tab" + "/",
          ]
          secret_patterns = {
              "private-key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "aws-access-key": re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              "aws-resource": re.compile(r"\barn:aws(?:-[a-z]+)?:[A-Za-z0-9_./:=+@-]+"),
              "aws-ecr": re.compile(r"\b\d{12}\.dkr\.ecr\.[A-Za-z0-9-]+\.amazonaws\.com\b"),
              "github-token": re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{24,}\b"),
              "github-fine-grained-token": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              "gitlab-token": re.compile(r"\bglpat-[A-Za-z0-9_-]{20,}\b"),
              "npm-token": re.compile(r"\bnpm_[A-Za-z0-9]{30,}\b"),
              "pypi-token": re.compile(r"\bpypi-AgEIcH[A-Za-z0-9_-]{40,}\b"),
              "huggingface-token": re.compile(r"\bhf_[A-Za-z0-9]{30,}\b"),
              "openai-key": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "anthropic-key": re.compile(r"\bsk-ant-[A-Za-z0-9_-]{20,}\b"),
              "slack-token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              "stripe-live-key": re.compile(r"\b[rs]k_live_[A-Za-z0-9]{16,}\b"),
              "google-api-key": re.compile(r"\bAIza[A-Za-z0-9_-]{30,}\b"),
              "sendgrid-key": re.compile(r"\bSG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b"),
              "azure-storage-key": re.compile(r"\bAccountKey=[A-Za-z0-9+/=]{20,}"),
              "jwt": re.compile(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b"),
              "bearer-token": re.compile(r"(?i)\bAuthorization\s*:\s*Bearer\s+[A-Za-z0-9._~+/-]{16,}"),
              "password-url": re.compile(r"(?i)\b[a-z][a-z0-9+.-]*://[^\s/:]+:[^\s/@]+@"),
          }
          content_violations = []
          for raw in tracked:
              try:
                  text = Path(raw).read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              semantic = semantic_text(raw, text)
              folded = semantic.casefold()
              for value in business_terms:
                  if value.casefold() in folded:
                      content_violations.append(f"business-term:{raw}")
              for value in developer_paths:
                  if value in semantic:
                      content_violations.append(f"developer-path:{raw}")
              for label, pattern in secret_patterns.items():
                  # Secrets always inspect the COMPLETE original file, including
                  # every reviewed binary payload; semantic filtering is not used.
                  if pattern.search(text):
                      content_violations.append(f"{label}:{raw}")

          violations = sorted(set(path_violations + content_violations))
          if violations:
              raise SystemExit(
                  "Repository boundary violations:\n"
                  + "\n".join(f"- {item}" for item in violations)
              )
          print(f"Checked {len(tracked)} tracked paths; repository boundary passed.")
          PY

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: repository-boundary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[pdf,dev]'

      - name: Run engine, Knowledge Hub, and legacy lab tests (including tests/atlas)
        run: python -m unittest discover -s tests -v

      - name: Exercise the default credential-free engine entry point
        shell: bash
        run: |
          qingtian selftest --output "$RUNNER_TEMP/engine-selftest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "engine-selftest.json").read_text())
          assert receipt["status"] == "passed", receipt
          assert receipt["scope"] == "synthetic-engine-selftest"
          assert receipt["model_called"] is False
          assert receipt["business_acceptance"] is False
          assert receipt["legacy_tasks_imported"] == 0
          assert receipt["checks"] and all(item["passed"] for item in receipt["checks"])
          PY

  browser-e2e:
    name: Isolated legacy lab browser E2E
    needs: repository-boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install optional browser runner
        run: |
          python -m pip install -e '.[browser]' 'playwright==1.55.0'
          python -c 'from importlib.metadata import version; assert version("playwright") == "1.55.0"'
          # The pinned Python package selects the matching Chromium revision.
          python -m playwright install --with-deps chromium
      - name: Keep the separate synthetic lab browser contract covered
        run: qingtian-lab demo-check --capability browser-e2e

  current-engine-browser:
    name: Current engine browser E2E (isolated synthetic tasks)
    needs: repository-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qingtian-playwright-browsers
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned browser runner and matching Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qingtian-engine-browser"
          python -m pip install -e '.[browser]' 'playwright==1.55.0' 2>&1 \
            | tee "$RUNNER_TEMP/qingtian-engine-browser/dependency-install.log"
          python -c 'from importlib.metadata import version; assert version("playwright") == "1.55.0"'
          python -m playwright install --with-deps chromium 2>&1 \
            | tee "$RUNNER_TEMP/qingtian-engine-browser/chromium-install.log"
      - name: Run the mandatory real-browser current-engine journey
        shell: bash
        run: |
          set -euo pipefail
          python -m tests.atlas.test_dashboard_journey \
            --browser-e2e "$RUNNER_TEMP/qingtian-engine-browser" 2>&1 \
            | tee "$RUNNER_TEMP/qingtian-engine-browser/driver.log"
      - name: Require a successful source-bound browser and cleanup receipt
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "qingtian-engine-browser"
          summary = json.loads((root / "summary.json").read_text())
          assert summary["schema_version"] == 1
          assert summary["scope"] == "current-engine-browser-e2e"
          assert summary["status"] == "passed" and summary["stage"] == "complete"
          assert summary["model_called"] is False
          assert summary["native_destination_opened"] is False
          assert summary["playwright_version"] == "1.55.0"
          assert summary["browser_version"] == "140.0.7339.16"
          assert summary["steps"] and summary["step_count"] == len(summary["steps"])
          assert summary["fixture_exit_code"] == 0
          assert summary["cleanup"]["server_thread_stopped"] is True
          assert summary["cleanup"]["temporary_tree_removed"] is True
          assert summary["cleanup"]["process_dispatch_attempts"] == 0
          driver = Path("tests/atlas/test_dashboard_journey.py")
          assert summary["test_source_sha256"] == sha256(driver.read_bytes()).hexdigest()
          assert summary["evolution_driver_sha256"] == sha256(driver.with_name("browser_evolution.py").read_bytes()).hexdigest()
          assert summary["evolution"]["real_http_and_browser"] is True
          assert summary["evolution"]["synthetic_executor"] is True
          assert summary["evolution"]["real_model_execution"] is False
          ledger = json.loads((root / "engine-browser-ledger.json").read_text())
          assert ledger["model_calls"] == 0 and ledger["sqlite_isolated"] is True
          assert ledger["synthetic_admission_runs"] == 1
          for name in ("service.py", "server.py", "runner.py", "db.py", "static/app.js"):
              expected = sha256((Path("qingtian_engine") / name).read_bytes()).hexdigest()
              assert summary["source_hashes"][name] == expected, name
              assert ledger["source_hashes_at_start"][name] == expected, name
          for name in (
              "browser-requests.json", "browser-responses.json", "browser-sse-frames.json",
              "browser-errors.json", "desktop-overview.png", "desktop-detail.png",
              "mobile-sensitive-detail.png", "mobile-onboarding.png",
          ):
              assert (root / name).is_file(), name
          assert json.loads((root / "browser-sse-frames.json").read_text())
          assert json.loads((root / "browser-errors.json").read_text()) == []
          print("Current-engine browser and cleanup receipt verified; no model or native-destination acceptance claimed.")
          PY
      - name: Preserve browser receipts and screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingtian-engine-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qingtian-engine-browser/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Distribution and installed CLI
    needs: [test, browser-e2e, current-engine-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2' 'setuptools>=78.1.1'
          python -m build

      - name: Check extracted source and allowlist documentation, assets, and example contracts
        run: python -m unittest discover -s tests -p test_distribution_contract.py -v

      - name: Audit distribution contents
        shell: bash
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from configparser import ConfigParser
          from pathlib import Path, PurePosixPath
          import json
          import re
          import tarfile
          import tomllib
          import zipfile

          expected_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one source distribution")
          import runpy
          check_headers = runpy.run_path("tests/test_distribution_contract.py")["assert_public_archive_headers"]
          for artifact in wheels + sdists:
              check_headers(artifact)

          forbidden_parts = {
              "vault", ".state", ".data", "source-archive", "receipts", "checkpoints",
              "runtime-data", "release", "__pycache__", ".venv", "venv", "output", "raw-logs"
          }
          forbidden_names = {
              "sources.json", ".env", ".DS_Store", ".qingtian-knowledge-root",
              "instance.lock", "server.log"
          }

          def private_path(name):
              path = PurePosixPath(name)
              return (
                  bool(forbidden_parts.intersection(path.parts))
                  or path.name in forbidden_names
                  or path.name.endswith(".local.json")
                  or path.name.endswith(".pid") or ".pid." in path.name
                  or (path.name.startswith(".env.") and path.name != ".env.example")
                  or re.search(r"\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?$", path.name, re.I)
                  or path.suffix.lower() in {".key", ".pem", ".p12", ".pfx", ".pyc", ".pyo"}
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
              required_wheel = {
                  "qingtian_engine/__init__.py",
                  "qingtian_engine/entrypoint.py",
                  "qingtian_engine/cli.py",
                  "qingtian_engine/config.py",
                  "qingtian_engine/server.py",
                  "qingtian_engine/multipart.py",
                  "qingtian_engine/runner.py",
                  "qingtian_engine/worker_entry.py",
                  "qingtian_engine/runtime_mode.py",
                  "qingtian_engine/project_config.py",
                  "qingtian_engine/selftest.py",
                  "qingtian_engine/knowledge.py",
                  "qingtian_engine/resources/policy.json",
                  "qingtian_engine/static/index.html",
                  "qingtian_engine/static/app.js",
                  "qingtian_engine/static/styles.css",
                  "qingtian_core/__init__.py",
                  "qingtian_core/cli.py",
                  "qingtian_core/demo_web.py",
                  "qingtian_core/capability_checks.py",
                  "qingtian_core/resources/capabilities.json",
                  "qingtian_core/resources/demo/index.html",
                  "qingtian_core/resources/demo/app.css",
                  "qingtian_core/resources/demo/app.js",
                  "qingtian_core/resources/schemas/task.schema.json",
                  "qingtian_core/resources/schemas/verification-receipt.schema.json",
                  "qingtian_kb/__init__.py",
                  "qingtian_kb/cli.py",
                  "qingtian_kb/resources/contracts/provider-request.schema.json",
                  "qingtian_kb/resources/contracts/provider-response.schema.json",
              }
              missing = sorted(required_wheel - wheel_names)
              if missing:
                  raise SystemExit(f"Wheel is missing required files: {missing}")
              metadata_name = next(
                  name for name in wheel_names if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              if metadata["Name"] != "qingtian-ai" or metadata["Version"] != expected_version:
                  raise SystemExit("Wheel metadata name/version mismatch")
              if metadata["Requires-Python"] != ">=3.11":
                  raise SystemExit("Wheel Python support metadata mismatch")
              if metadata["License-Expression"] != "Apache-2.0":
                  raise SystemExit("Wheel metadata is missing the Apache-2.0 expression")
              entry_points_name = next(name for name in wheel_names if name.endswith(".dist-info/entry_points.txt"))
              entry_points = ConfigParser()
              entry_points.read_string(archive.read(entry_points_name).decode("utf-8"))
              expected_commands = {
                  "qingtian": "qingtian_engine.entrypoint:main",
                  "qingtian-lab": "qingtian_core.cli:main",
                  "qingtian-kb": "qingtian_kb.cli:main",
              }
              for command, target in expected_commands.items():
                  if entry_points["console_scripts"].get(command) != target:
                      raise SystemExit(f"Installed entry point mismatch: {command}")
              if archive.read("qingtian_engine/resources/policy.json") != Path("qingtian_engine/resources/policy.json").read_bytes():
                  raise SystemExit("Engine policy differs in wheel")
              for root_schema in Path("schemas").glob("*.json"):
                  packaged = f"qingtian_core/resources/schemas/{root_schema.name}"
                  if archive.read(packaged) != root_schema.read_bytes():
                      raise SystemExit(f"Core schema differs in wheel: {root_schema.name}")
              for root_schema in Path("contracts").glob("*.schema.json"):
                  packaged = f"qingtian_kb/resources/contracts/{root_schema.name}"
                  if archive.read(packaged) != root_schema.read_bytes():
                      raise SystemExit(f"Provider schema differs in wheel: {root_schema.name}")
              for name in wheel_names:
                  if private_path(name):
                      raise SystemExit(f"Private/generated path in wheel: {name}")
                  if name.startswith(("docs/", "examples/", "output/")) or name.endswith((".mp4", ".webm", ".pptx", ".excalidraw")):
                      raise SystemExit(f"Non-runtime editorial asset in wheel: {name}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              members = [item for item in archive.getmembers() if item.isfile()]
              if not members:
                  raise SystemExit("Source distribution is empty")
              roots = {PurePosixPath(item.name).parts[0] for item in members}
              if len(roots) != 1:
                  raise SystemExit("Source distribution has multiple roots")
              root = next(iter(roots))
              relative = {
                  PurePosixPath(*PurePosixPath(item.name).parts[1:]).as_posix()
                  for item in members
              }
              package_info = archive.extractfile(root + "/PKG-INFO")
              if package_info is None:
                  raise SystemExit("Source distribution lacks PKG-INFO")
              source_metadata = BytesParser().parsebytes(package_info.read())
              if source_metadata["Name"] != "qingtian-ai" or source_metadata["Version"] != expected_version:
                  raise SystemExit("Source distribution metadata name/version mismatch")
              required_sdist = {
                  "scripts/repository_boundary.py",
                  ".gitattributes",
                  ".github/workflows/ci.yml",
                  ".gitignore",
                  "CHANGELOG.md",
                  "CONTRIBUTING.md",
                  "LICENSE",
                  "MANIFEST.in",
                  "NOTICE",
                  "README.md",
                  "SECURITY.md",
                  "config/sources.example.json",
                  "contracts/provider-request.schema.json",
                  "contracts/provider-response.schema.json",
                  "docs/ADOPTION.md",
                  "docs/ARCHITECTURE.md",
                  "docs/ENGINE-ARCHITECTURE.md",
                  "docs/ENGINE-CAPABILITIES.md",
                  "docs/ENGINE-API.md",
                  "docs/diagrams/engine-overview.excalidraw",
                  "docs/diagrams/engine-overview.svg",
                  "docs/diagrams/engine-overview.png",
                  "docs/diagrams/engine-lifecycle.excalidraw",
                  "docs/diagrams/engine-lifecycle.svg",
                  "docs/diagrams/engine-lifecycle.png",
                  "docs/BRAND.md",
                  "docs/CAPABILITIES.md",
                  "docs/DEMO.md",
                  "docs/diagrams/01-overall.excalidraw",
                  "docs/diagrams/01-overall.png",
                  "docs/diagrams/02-handoff.excalidraw",
                  "docs/diagrams/02-handoff.png",
                  "docs/diagrams/03-knowledge.excalidraw",
                  "docs/diagrams/03-knowledge.png",
                  "docs/diagrams/04-verification.excalidraw",
                  "docs/diagrams/04-verification.png",
                  "docs/diagrams/qingtian-architecture.excalidraw",
                  "examples/project.adapter.json",
                  "examples/task.json",
                  "pyproject.toml",
                  "qingtian",
                  "qingtian-kb",
                  "release-allowlist.json",
                  "schemas/task.schema.json",
                  "tests/test_cli.py",
                  "tests/test_core_bundle.py",
                  "tests/test_core_cli.py",
                  "tests/test_core_contracts.py",
                  "tests/test_core_provider.py",
                  "tests/test_core_store.py",
                  "tests/test_core_verification.py",
                  "tests/test_engine.py",
                  "tests/test_demo_web.py",
                  "tests/test_capability_checks.py",
                  "tests/test_capability_catalog.py",
                  "tests/test_packaging.py",
                  "tests/test_provider.py",
                  "tests/atlas/__init__.py",
                  "tests/atlas/test_engine_mode.py",
                  "tests/atlas/test_public_runtime.py",
                  "tests/atlas/test_runtime_lifecycle.py",
                  "tests/atlas/test_server_intake.py",
                  "tests/atlas/test_worktree_worker.py",
              }
              required_sdist.update(required_wheel)
              # Source archives must preserve the complete independently-reviewed kit,
              # not merely the historical minimal subset above.
              required_sdist.update(json.loads(Path("release-allowlist.json").read_text())["paths"])
              missing = sorted(required_sdist - relative)
              if missing:
                  raise SystemExit(f"Source distribution is missing files: {missing}")
              source_tests = {
                  path.as_posix() for path in Path("tests").rglob("*.py")
              }
              packaged_tests = {
                  name for name in relative
                  if name.startswith("tests/") and name.endswith(".py")
              }
              if packaged_tests != source_tests:
                  raise SystemExit(
                      "Source distribution test set differs from checkout: "
                      f"missing={sorted(source_tests - packaged_tests)}, "
                      f"extra={sorted(packaged_tests - source_tests)}"
                  )
              for name in relative:
                  if private_path(name):
                      raise SystemExit(f"Private/generated path in source distribution: {name}")
              if any(item.issym() or item.islnk() for item in archive.getmembers()):
                  raise SystemExit("Source distribution contains a link")
          print(f"Audited {wheels[0].name} and {sdists[0].name} ({root}).")
          PY

      - name: Smoke-test installed wheel outside source tree
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          export QINGTIAN_EXPECTED_PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --upgrade pip
          "$smoke_root/venv/bin/python" -m pip install "$artifact"

          cd "$smoke_root"
          export QINGTIAN_ENGINE_HOME="$smoke_root/engine"
          export QINGTIAN_KNOWLEDGE_CONFIG="$smoke_root/disabled-knowledge.json"
          export QINGTIAN_PROJECTS_CONFIG="$smoke_root/disabled-projects.json"
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian" --workspace "$smoke_root" doctor > engine-doctor.json
          test ! -e "$smoke_root/engine"
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian" --workspace "$smoke_root" init > engine-init.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian" selftest > engine-selftest.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-lab" doctor > lab-doctor.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-lab" init --db "$smoke_root/lab/control.db" > lab-init.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-lab" demo --db "$smoke_root/lab/control.db" > lab-demo.json

          env -u PYTHONPATH "$smoke_root/venv/bin/python" - <<'PY'
          from http.client import HTTPConnection
          from importlib.metadata import version
          import json
          import os
          from pathlib import Path
          import signal
          import socket
          import subprocess
          import sys
          import tempfile
          import time

          root = Path.cwd().resolve()
          state = root / "engine"
          assert version("qingtian-ai") == os.environ["QINGTIAN_EXPECTED_PACKAGE_VERSION"]
          doctor = json.loads((root / "engine-doctor.json").read_text())
          assert doctor["dashboard_ready"] and doctor["read_only"]
          assert doctor["credentials_checked"] is False
          initialized = json.loads((root / "engine-init.json").read_text())
          assert initialized["initialized"] and initialized["imported"] == {}
          receipt = json.loads((root / "engine-selftest.json").read_text())
          assert receipt["status"] == "passed" and receipt["scope"] == "synthetic-engine-selftest"
          assert receipt["model_called"] is False and receipt["legacy_tasks_imported"] == 0
          assert receipt["checks"] and all(check["passed"] for check in receipt["checks"])
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              port = probe.getsockname()[1]
          environment = {**os.environ, "QINGTIAN_INTAKE_PLANNER": "", "PYTHONDONTWRITEBYTECODE": "1"}
          environment.pop("PYTHONPATH", None)

          def request(method, path, payload=None):
              connection = HTTPConnection("127.0.0.1", port, timeout=2)
              body = None if payload is None else json.dumps(payload).encode()
              headers = {} if payload is None else {"Content-Type": "application/json"}
              try:
                  connection.request(method, path, body=body, headers=headers)
                  response = connection.getresponse()
                  return response.status, response.read(), dict(response.getheaders())
              finally:
                  connection.close()

          with tempfile.TemporaryFile() as logs:
              process = subprocess.Popen(
                  [sys.executable, "-m", "qingtian_engine.server", "--data-dir", str(state),
                   "--workspace", str(root), "--mode", "manual", "--port", str(port)],
                  cwd=root, env=environment, stdin=subprocess.DEVNULL, stdout=logs, stderr=logs,
              )
              try:
                  deadline = time.monotonic() + 15
                  while True:
                      if process.poll() is not None:
                          raise AssertionError("Installed engine exited before HTTP became ready")
                      try:
                          status, body, _ = request("GET", "/api/health")
                          if status == 200:
                              health = json.loads(body)
                              break
                      except OSError:
                          pass
                      if time.monotonic() >= deadline:
                          raise AssertionError("Installed engine HTTP startup timed out")
                      time.sleep(0.1)
                  assert health["mode"] == "manual" and health["automatic_dispatch"] is False
                  assert health["read_only"] is False and health["pid"] == process.pid
                  assert Path(health["data_dir"]).resolve() == state
                  assert Path(health["workspace"]).resolve() == root
                  for route, kind in (("/", "text/html"), ("/app.js", "application/javascript"), ("/styles.css", "text/css")):
                      status, body, headers = request("GET", route)
                      assert status == 200 and len(body) > 20, route
                      assert headers["Content-Type"].startswith(kind), route
                  status, body, _ = request("GET", "/api/dashboard")
                  dashboard = json.loads(body)
                  assert status == 200 and dashboard["tasks"] == [] and dashboard["runs"] == []
                  status, body, _ = request("POST", "/api/tasks", {"title": "Synthetic CI pending task", "priority": 0})
                  assert status == 201
                  task = json.loads(body)
                  assert task["state"] == "INBOX" and task["runs"] == []
                  # Observe a real installed watchdog cycle, not only startup.
                  started_at = health["watchdog"]["last_success_at"]
                  deadline = time.monotonic() + 25
                  while time.monotonic() < deadline:
                      status, body, _ = request("GET", "/api/health")
                      health = json.loads(body)
                      if status == 200 and health["watchdog"]["last_success_at"] != started_at:
                          break
                      time.sleep(0.25)
                  else:
                      raise AssertionError("Installed manual watchdog did not complete a cycle")
                  status, body, _ = request("GET", "/api/dashboard")
                  dashboard = json.loads(body)
                  assert status == 200 and len(dashboard["tasks"]) == 1 and dashboard["runs"] == []
                  assert dashboard["tasks"][0]["state"] == "INBOX"
              finally:
                  if process.poll() is None:
                      process.send_signal(signal.SIGTERM)
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
                      raise AssertionError("Installed engine did not stop after SIGTERM")
                  assert process.returncode == 0, "Installed engine did not exit cleanly"
                  assert not (state / "run/server.pid").exists()
                  assert (state / "run/instance.lock").read_text() == ""
          print("Installed candidate engine: empty init, selftest, HTTP assets, manual watchdog and clean shutdown passed.")
          PY

          mkdir -p "$smoke_root/project/docs" "$smoke_root/knowledge"
          printf '%s\n' '# Synthetic project' 'An architecture decision uses bounded evidence.' > "$smoke_root/project/README.md"
          printf '%s\n' '# Decision' 'The synthetic workflow records a checkpoint.' > "$smoke_root/project/docs/decision.md"
          cd "$smoke_root/knowledge"
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" init \
            --workspace "$smoke_root/project" --project wheel-smoke > init.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" doctor > doctor.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" plan > plan.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" ingest > ingest.json
          env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" validate > validate.json
          printf '%s\n' '{"schema_version":"1.0","query":"architecture decision","caller_id":"wheel-smoke","purpose":"test","retrieval_modes":["history"]}' \
            | env -u PYTHONPATH "$smoke_root/venv/bin/qingtian-kb" provider-query > provider.json

          "$smoke_root/venv/bin/python" - <<'PY'
          from importlib.resources import files
          import json

          for package, names in {
              "qingtian_core.resources.schemas": [
                  "task.schema.json", "verification-receipt.schema.json"
              ],
              "qingtian_kb.resources.contracts": [
                  "provider-request.schema.json", "provider-response.schema.json"
              ],
          }.items():
              root = files(package)
              for name in names:
                  json.loads(root.joinpath(name).read_text(encoding="utf-8"))
          response = json.loads(open("provider.json", encoding="utf-8").read())
          if response["result_count"] < 1:
              raise SystemExit("Installed Knowledge Hub did not return ingested history")
          if any(item["authoritative"] or item["eligible_for_generation"] for item in response["results"]):
              raise SystemExit("Historical smoke data was incorrectly promoted")
          PY

      - name: Build, verify, extract, and test release allowlist bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          source_tests = {
                  path.as_posix() for path in Path("tests").rglob("*.py")
          }
          document = json.loads(
              Path("release-allowlist.json").read_text(encoding="utf-8")
          )
          allowlisted_tests = {
              path for path in document["paths"]
              if path.startswith("tests/") and path.endswith(".py")
          }
          if allowlisted_tests != source_tests:
              raise SystemExit(
                  "Release allowlist test set differs from checkout: "
                  f"missing={sorted(source_tests - allowlisted_tests)}, "
                  f"extra={sorted(allowlisted_tests - source_tests)}"
              )
          PY
          mkdir -p release
          python -m qingtian_engine.entrypoint bundle --root . --output release/qingtianAI.tar.gz
          python -m qingtian_engine.entrypoint bundle-verify --bundle release/qingtianAI.tar.gz
          bundle_test_root=$(mktemp -d)
          trap 'rm -rf "$bundle_test_root"' EXIT
          bundle_source="$(
            BUNDLE_TEST_ROOT="$bundle_test_root" python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          archive_path = Path("release/qingtianAI.tar.gz").resolve()
          destination = Path(os.environ["BUNDLE_TEST_ROOT"]).resolve()
          import runpy
          runpy.run_path("tests/test_distribution_contract.py")["assert_public_archive_headers"](archive_path)
          with tarfile.open(archive_path, "r:gz") as archive:
              members = archive.getmembers()
              roots = {
                  PurePosixPath(member.name).parts[0]
                  for member in members
                  if PurePosixPath(member.name).parts
              }
              if len(roots) != 1:
                  raise SystemExit(f"Bundle must have exactly one root: {sorted(roots)}")
              archive.extractall(destination, filter="data")
          print(destination / next(iter(roots)))
          PY
          )"
          cd "$bundle_source"
          test ! -e .qingtian-knowledge-root
          test -f qingtian_kb/resources/knowledge-root-marker.txt
          env -u PYTHONPATH python -m pip install -e '.[pdf,dev]'
          env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 \
            python -m unittest discover -s tests -v
          env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 \
            python -m qingtian_engine.entrypoint selftest
